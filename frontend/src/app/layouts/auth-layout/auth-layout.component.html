<div class="auth-container">
  <!-- Professional Loading Animation - Clean and centered -->
  <div class="loading-overlay" *ngIf="loading">
    <div class="loading-background"></div>
    <div class="loading-container">
      <div class="loading-content">
        <app-loading-spinner
          size="large"
          text="Connecting to MyCLOUDMEN"
          [showText]="true"
        >
        </app-loading-spinner>
      </div>
    </div>
  </div>

  <div class="auth-content" [class.hidden]="loading">
    <router-outlet></router-outlet>
  </div>
</div>
